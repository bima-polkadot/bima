[package]
name = "bima_escrow"
version = "1.0.0"
authors = ["Bima Team <team@bima.com>"]
edition = "2021"

[dependencies]
ink = { version = "^5.0.0", default-features = false }
scale = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive", "alloc"] }
scale-info = { version = "2", default-features = false, features = ["derive"] }

[dev-dependencies]
ink_e2e = "^5.0.0"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
]

[lib]
path = "lib.rs"